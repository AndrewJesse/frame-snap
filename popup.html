<!DOCTYPE html>
<html lang="en" class="extension-popup">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrameSnap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <h1>
      <img class="logo" src="icons/brand-logo.webp" width="22" height="22" alt="">
      FrameSnap
    </h1>
    <p class="eyebrow">On this device</p>
  </header>

  <button id="capture-btn" class="action-button" type="button">Capture Current Frame</button>

  <p id="banner" class="banner" hidden></p>

  <section id="workspace" class="workspace" hidden>
    <div class="shot-frame">
      <img id="workspace-shot" alt="" draggable="false">
    </div>
    <div class="workspace-meta">
      <button id="workspace-time" class="time" type="button"></button>
      <p id="workspace-detail"></p>
    </div>
  </section>

  <section id="empty-state" class="empty">
    <p class="empty-title">No frames yet</p>
    <p>Play a video, then capture the current frame. Snapshots stay in local storage on this device.</p>
  </section>

  <section id="history" class="history" hidden>
    <div class="history-head">
      <h2>On this device</h2>
      <span id="history-count"></span>
    </div>
    <div id="history-grid" class="grid"></div>
  </section>

  <footer class="foot">
    <p>Snapshots stay on this device.</p>
    <p><a href="https://free-utils.com">https://free-utils.com</a></p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
